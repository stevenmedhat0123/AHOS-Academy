name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies
      run: npm install

    - name: Add and Sync Android
      run: |
        npx cap add android
        npx cap sync android

    - name: Fix SDK to 35 and Update Gradle Plugin
      run: |
        # تغيير إصدار الـ SDK إلى 35
        sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle
        sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle
        
        # تحديث أداة الأندرويد في Gradle عشان تقبل 35
        sed -i 's/com.android.tools.build:gradle:[0-9.]*;/com.android.tools.build:gradle:8.7.2;/g' android/build.gradle

    - name: Update Gradle Wrapper and Build
      run: |
        cd android
        chmod +x gradlew
        ./gradlew wrapper --gradle-version 8.9
        ./gradlew assembleDebug

    - name: Zip Web Files for OTA Update
      run: |
        cd www
        zip -r ../update.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0-build${{ github.run_number }}
        name: Release v1.0.0-build${{ github.run_number }}
        files: |
          android/app/build/outputs/apk/debug/app-debug.apk
          update.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
